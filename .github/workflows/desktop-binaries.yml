name: Desktop binaries (on demand)

# Manual only. Run it from a v* tag (Actions > Desktop binaries (on demand) > Run workflow >
# "Use workflow from": pick the tag, not a branch). Builds Windows and/or macOS
# self-contained binaries for that tag and uploads them to its draft release (created by
# release.yml). The `release` environment only accepts v* tags, and needs approval before
# anything is uploaded.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which binaries to build
        required: true
        type: choice
        options: [windows, macos, both]
        default: both

permissions:
  contents: read

jobs:
  plan:
    name: select platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          if [[ "$REF_TYPE" != tag || "$REF_NAME" != v* ]]; then
            echo "::error::Run this workflow from a v* tag: choose it under 'Use workflow from'."
            exit 1
          fi
          win='{"os":"windows-latest","rid":"win-x64"},{"os":"windows-latest","rid":"win-arm64"}'
          mac='{"os":"macos-latest","rid":"osx-x64"},{"os":"macos-latest","rid":"osx-arm64"}'
          case "$PLATFORMS" in
            windows) include="$win" ;;
            macos) include="$mac" ;;
            both) include="$win,$mac" ;;
            *) echo "Unknown platforms: $PLATFORMS"; exit 1 ;;
          esac
          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"

  build:
    name: publish (${{ matrix.rid }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --solution AllMyTasks.slnx -c Release

      - name: Publish
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RID: ${{ matrix.rid }}
        run: |
          version="${TAG#v}"
          dotnet publish src/AllMyTasks/AllMyTasks.csproj -c Release -r "$RID" \
            --self-contained true -p:PublishSingleFile=true -p:RestoreLockedMode=false \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version="$version" -o "out/$RID"

      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p dist
          name="AllMyTasks-${TAG}-${RID}"
          if [[ "$RID" == win-* ]]; then
            (cd "out/$RID" && 7z a -tzip "../../dist/${name}.zip" . > /dev/null)
          else
            tar -C "out/$RID" -czf "dist/${name}.tar.gz" .
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  upload:
    name: add to draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewer (the maintainer) must approve before this job gets a write token.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded. SHA256SUMS.txt from the Linux build does not cover these files; checksums:"
          (cd dist && sha256sum *)
