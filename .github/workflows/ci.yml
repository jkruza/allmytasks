name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token. No secrets are used by this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides whether the change touches anything but documentation. See docs/design/ci-docs-only-changes.md.
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect code changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Fail safe: anything unexpected counts as a code change.
          code=true
          range=""
          if [ "$EVENT" = "pull_request" ]; then range="$BASE_SHA...HEAD"; fi
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then range="$BEFORE_SHA..HEAD"; fi
          if [ -n "$range" ] && files=$(git diff --name-only "$range"); then
            echo "Changed files:"; echo "$files"
            # Docs-only = every changed file is documentation or a repo template.
            if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/.*|.*\.md|LICENSE|\.github/ISSUE_TEMPLATE/.*)$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  build:
    needs: changes
    # Job names are required status checks in .github/rulesets/main-protection.json; keep them in sync.
    # The job always runs so those checks report; for docs-only changes every real step is skipped.
    # Don't skip the whole job with `if:`: a skipped matrix job reports under the unexpanded name
    # and the required checks would stay pending.
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          global-json-file: global.json

      - name: Restore
        if: needs.changes.outputs.code == 'true'
        run: dotnet restore AllMyTasks.slnx

      - name: Check formatting
        if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
        run: dotnet format AllMyTasks.slnx --verify-no-changes --no-restore

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: dotnet build AllMyTasks.slnx -c Release --no-restore

      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: dotnet test --solution AllMyTasks.slnx -c Release --no-build

      - name: Skipped (docs-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "Only documentation changed; build and test skipped."
