name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token. No secrets are used by this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decides whether the change touches anything but documentation. See docs/design/ci-docs-only-changes.md.
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect code changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Fail safe: anything unexpected counts as a code change.
          code=true
          range=""
          if [ "$EVENT" = "pull_request" ]; then range="$BASE_SHA...HEAD"; fi
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then range="$BEFORE_SHA..HEAD"; fi
          if [ -n "$range" ] && files=$(git diff --name-only "$range"); then
            echo "Changed files:"; echo "$files"
            # Docs-only = every changed file is documentation or a repo template.
            if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/.*|.*\.md|LICENSE|\.github/ISSUE_TEMPLATE/.*)$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  build:
    needs: changes
    # Job names are required status checks in .github/rulesets/main-protection.json; keep them in sync.
    # The job always runs so those checks report; for docs-only changes every real step is skipped.
    # Don't skip the whole job with `if:`: a skipped matrix job reports under the unexpanded name
    # and the required checks would stay pending.
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          global-json-file: global.json

      - name: Restore
        if: needs.changes.outputs.code == 'true'
        run: dotnet restore AllMyTasks.slnx

      - name: Check formatting
        if: needs.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
        run: dotnet format AllMyTasks.slnx --verify-no-changes --no-restore

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: dotnet build AllMyTasks.slnx -c Release --no-restore

      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: dotnet test --solution AllMyTasks.slnx -c Release --no-build

      - name: Skipped (docs-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "Only documentation changed; build and test skipped."

  package:
    # Builds every platform's package on every run (unsigned) so packaging cannot rot until release day.
    # Like `build`, the job always runs and skips its steps for docs-only changes. See docs/design/packaging.md.
    needs: changes
    name: package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          global-json-file: global.json

      - name: Publish
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: bash packaging/publish.sh "${{ matrix.rid }}" "$VERSION" "out/${{ matrix.rid }}"

      - name: Package (Linux)
        if: needs.changes.outputs.code == 'true' && startsWith(matrix.rid, 'linux-')
        run: bash packaging/linux/build.sh "${{ matrix.rid }}" "$VERSION" "out/${{ matrix.rid }}" dist

      - name: Smoke test (Linux)
        if: needs.changes.outputs.code == 'true' && matrix.rid == 'linux-x64'
        run: bash packaging/linux/smoke.sh "$VERSION" dist

      - name: Package (Windows)
        if: needs.changes.outputs.code == 'true' && startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Rid '${{ matrix.rid }}' -Version $env:VERSION -PublishDir 'out/${{ matrix.rid }}' -DistDir dist

      - name: Smoke test (Windows)
        if: needs.changes.outputs.code == 'true' && matrix.rid == 'win-x64'
        shell: pwsh
        run: ./packaging/windows/smoke.ps1 -Msi "dist/AllMyTasks-$env:VERSION-windows-x64.msi" -Version $env:VERSION

      - name: Package (archive)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            (cd "out/${{ matrix.rid }}" && 7z a -tzip "../../dist/AllMyTasks-${VERSION}-${{ matrix.rid }}.zip" . > /dev/null)
          else
            tar -C "out/${{ matrix.rid }}" -czf "dist/AllMyTasks-${VERSION}-${{ matrix.rid }}.tar.gz" .
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.code == 'true'
        with:
          name: package-${{ matrix.rid }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

      - name: Skipped (docs-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "Only documentation changed; packaging skipped."
