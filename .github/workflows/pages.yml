name: Pages

# Publishes the static project site in site/ to GitHub Pages. See docs/design/project-site.md.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - ".github/pages/**"
  # A release changed: redeploy so the download section follows. The release event runs on the
  # tag, which the github-pages environment does not accept, so the `redeploy` job below only
  # dispatches this workflow on main. See docs/design/site-downloads.md.
  release:
    types: [published, edited, deleted, unpublished]
  # Safety net if a release event is ever missed.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of the release that changed (set by the release trigger); the run waits until the releases list shows it"
        required: false
        default: ""
      release_action:
        description: "Release event type: published, edited, deleted or unpublished"
        required: false
        default: ""

# Read-only repository token; the two extra scopes are what actions/deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment half way; a newer run just queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ACTION: ${{ github.event.action }}
        run: |
          gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY" \
            -f release_tag="$RELEASE_TAG" -f release_action="$RELEASE_ACTION"

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the download renderer
        run: python3 -m unittest discover -s .github/pages
      # After a release event the API can lag behind it, so wait until the list shows the change.
      - name: Fill in the download section from the GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ACTION: ${{ inputs.release_action }}
        timeout-minutes: 8
        run: |
          python3 .github/pages/fetch_releases.py "$GITHUB_REPOSITORY" "$RUNNER_TEMP/releases.json" "$RELEASE_TAG" "$RELEASE_ACTION"
          python3 .github/pages/render_downloads.py "$RUNNER_TEMP/releases.json" site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
