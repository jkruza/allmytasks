name: Release

# Runs when an admin pushes a v* tag (only admins can create them, see
# .github/rulesets/protect-release-tags.json). Builds self-contained binaries and
# publishes a draft release after the `release` environment is approved.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --solution AllMyTasks.slnx -c Release

      # The project's OAuth clients are supplied as repository secrets (a variable of the same name also works) and compiled
      # into the build as assembly metadata. Any that are missing just mean the app asks the user for their own client; see
      # docs/oauth-setup.md. Values are never printed.
      - name: Check OAuth client settings
        shell: bash
        env:
          AMT_MICROSOFT_CLIENT_ID: ${{ secrets.AMT_MICROSOFT_CLIENT_ID || vars.AMT_MICROSOFT_CLIENT_ID }}
          AMT_GOOGLE_CLIENT_ID: ${{ secrets.AMT_GOOGLE_CLIENT_ID || vars.AMT_GOOGLE_CLIENT_ID }}
          AMT_GOOGLE_CLIENT_SECRET: ${{ secrets.AMT_GOOGLE_CLIENT_SECRET }}
        run: |
          check() {
            if [[ -n "${!1}" ]]; then
              echo "- $1: embedded" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::notice title=$1 not set::This build has no built-in $2; users must enter their own client (docs/oauth-setup.md)."
              echo "- $1: not set, users must enter their own" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          echo "### OAuth clients (${{ matrix.rid }})" >> "$GITHUB_STEP_SUMMARY"
          check AMT_MICROSOFT_CLIENT_ID "Microsoft client"
          check AMT_GOOGLE_CLIENT_ID "Google client"
          check AMT_GOOGLE_CLIENT_SECRET "Google client secret"
          if [[ -n "$AMT_GOOGLE_CLIENT_ID" && -z "$AMT_GOOGLE_CLIENT_SECRET" ]]; then
            echo "::warning title=Google client secret missing::AMT_GOOGLE_CLIENT_ID is set without AMT_GOOGLE_CLIENT_SECRET; Google rejects the token request. Set both or neither."
          fi
          if [[ -z "$AMT_GOOGLE_CLIENT_ID" && -n "$AMT_GOOGLE_CLIENT_SECRET" ]]; then
            echo "::warning title=Google client id missing::AMT_GOOGLE_CLIENT_SECRET is set without AMT_GOOGLE_CLIENT_ID and will be ignored."
          fi

      - name: Publish
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RID: ${{ matrix.rid }}
          AMT_MICROSOFT_CLIENT_ID: ${{ secrets.AMT_MICROSOFT_CLIENT_ID || vars.AMT_MICROSOFT_CLIENT_ID }}
          AMT_GOOGLE_CLIENT_ID: ${{ secrets.AMT_GOOGLE_CLIENT_ID || vars.AMT_GOOGLE_CLIENT_ID }}
          AMT_GOOGLE_CLIENT_SECRET: ${{ secrets.AMT_GOOGLE_CLIENT_SECRET }}
        run: bash packaging/publish.sh "$RID" "${TAG#v}" "out/$RID"

      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p dist
          name="AllMyTasks-${TAG}-${RID}"
          if [[ "$RID" == win-* ]]; then
            (cd "out/$RID" && 7z a -tzip "../../dist/${name}.zip" . > /dev/null)
          else
            tar -C "out/$RID" -czf "dist/${name}.tar.gz" .
          fi

      - name: Linux packages (AppImage, deb, rpm)
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RID: ${{ matrix.rid }}
        run: bash packaging/linux/build.sh "$RID" "${TAG#v}" "out/$RID" dist

      - name: Linux smoke test
        if: matrix.rid == 'linux-x64'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: bash packaging/linux/smoke.sh "${TAG#v}" dist

      - name: Windows installer (MSI)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./packaging/windows/build.ps1 -Rid '${{ matrix.rid }}' -Version ($env:TAG.TrimStart('v')) -PublishDir 'out/${{ matrix.rid }}' -DistDir dist

      - name: Windows smoke test
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:TAG.TrimStart('v')
          ./packaging/windows/smoke.ps1 -Msi "dist/AllMyTasks-$v-windows-x64.msi" -Version $v

      # Authenticode signing is optional and not configured yet (the signing route is still being decided, see
      # docs/design/packaging.md). When it is, add signing steps for out/win-*/AllMyTasks.exe (before the MSI is built)
      # and dist/*.msi (after), with credentials from the `release` environment; until then the build says it is unsigned.
      - name: Windows signing (not configured)
        if: startsWith(matrix.rid, 'win-')
        shell: bash
        run: |
          echo "::notice title=Windows installer is unsigned::Authenticode signing is not configured; SmartScreen will warn (docs/design/packaging.md)."
          echo "- ${{ matrix.rid }}: MSI unsigned" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required reviewer (the maintainer) must approve before this job gets a write token.
    environment: release
    permissions:
      contents: write
      id-token: write      # build provenance attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "$TAG" --generate-notes
