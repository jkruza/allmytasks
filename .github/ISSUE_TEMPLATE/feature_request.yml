name: Feature request
description: Suggest an idea or a new provider.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: input
    id: provider
    attributes:
      label: Provider, if any
      placeholder: e.g. Google Calendar, Todoist, CalDAV
